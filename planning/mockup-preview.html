#widget {

(() =&gt; {

function graph(){
 const pred=state.w*2+state.b,loss=.5*(pred-3)**2;
 return &#x27;&lt;div class=&quot;cc-stepstrip&quot;&gt;&lt;span class=&quot;&#x27;+(state.phase===0?&#x27;is-current&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;1 · Forward&lt;/span&gt;&lt;span class=&quot;&#x27;+(state.phase===1?&#x27;is-current&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;2 · Backward&lt;/span&gt;&lt;span class=&quot;&#x27;+(state.phase===2?&#x27;is-current&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;3 · Update&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cc-graph&quot; role=&quot;img&quot; aria-label=&quot;Input 2, prediction &#x27;+number(pred)+&#x27;, loss &#x27;+number(loss)+&#x27;&quot;&gt;&lt;div class=&quot;cc-node&quot;&gt;&lt;span class=&quot;cc-small&quot;&gt;Input x&lt;/span&gt;&lt;strong&gt;2&lt;/strong&gt;&lt;span class=&quot;cc-small&quot;&gt;target = 3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cc-arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;cc-node active&quot;&gt;&lt;span class=&quot;cc-small&quot;&gt;w × x + b&lt;/span&gt;&lt;strong&gt;&#x27;+number(pred)+&#x27;&lt;/strong&gt;&lt;span class=&quot;cc-small&quot;&gt;prediction&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cc-arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;cc-node&quot;&gt;&lt;span class=&quot;cc-small&quot;&gt;½(ŷ − y)²&lt;/span&gt;&lt;strong&gt;&#x27;+number(loss)+&#x27;&lt;/strong&gt;&lt;span class=&quot;cc-small&quot;&gt;loss&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cc-flex cc-between cc-small&quot;&gt;&lt;span&gt;w = &#x27;+number(state.w)+&#x27; · b = &#x27;+number(state.b)+&#x27;&lt;/span&gt;&lt;span&gt;learning rate = &#x27;+number(state.lr)+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;+(state.phase===1?&#x27;&lt;div class=&quot;cc-gradient&quot;&gt;dL/dw = −4 · dL/db = −2&lt;br&gt;Gradients are ready. Parameters are still w = 0.5, b = 0.&lt;/div&gt;&#x27;:state.phase===2?&#x27;&lt;div class=&quot;cc-gradient&quot;&gt;Update applied, then forward recomputed.&lt;br&gt;w ← 0.5 − η(−4) · b ← 0 − η(−2)&lt;/div&gt;&#x27;:&#x27;&lt;p class=&quot;cc-small&quot;&gt;Forward evaluated the current parameters. No gradients or updates yet.&lt;/p&gt;&#x27;);

function check(){
 const radioName=&#x27;cc-answer-&#x27;+Math.random().toString(36).slice(2);
 return &#x27;&lt;div class=&quot;cc-panel&quot;&gt;&lt;div class=&quot;cc-flex cc-between&quot;&gt;&lt;h3&gt;Predict before you run it&lt;/h3&gt;&lt;span class=&quot;cc-pill&quot;&gt;Understanding check&lt;/span&gt;&lt;/div&gt;&lt;p&gt;After &lt;code&gt;loss.backward()&lt;/code&gt;, before &lt;code&gt;optimizer.step()&lt;/code&gt;, what has changed?&lt;/p&gt;&lt;label class=&quot;cc-answer&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;&#x27;+radioName+&#x27;&quot; value=&quot;weights&quot; data-answer=&quot;weights&quot; &#x27;+(state.answer===&#x27;weights&#x27;?&#x27;checked&#x27;:&#x27;&#x27;)+&#x27;&gt;The model weights have been updated.&lt;/label&gt;&lt;label class=&quot;cc-answer&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;&#x27;+radioName+&#x27;&quot; value=&quot;gradients&quot; data-answer=&quot;gradients&quot; &#x27;+(state.answer===&#x27;gradients&#x27;?&#x27;checked&#x27;:&#x27;&#x27;)+&#x27;&gt;The gradient buffers are populated; weights are unchanged.&lt;/label&gt;&lt;label class=&quot;cc-answer&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;&#x27;+radioName+&#x27;&quot; value=&quot;unknown&quot; data-answer=&quot;unknown&quot; &#x27;+(state.answer===&#x27;unknown&#x27;?&#x27;checked&#x27;:&#x27;&#x27;)+&#x27;&gt;I’m not sure yet.&lt;/label&gt;&lt;button class=&quot;cc-primary&quot; data-action=&quot;check&quot; &#x27;+(!state.answer?&#x27;disabled&#x27;:&#x27;&#x27;)+&#x27;&gt;Check my prediction&lt;/button&gt;&#x27;+(state.result?&#x27;&lt;div class=&quot;cc-result &#x27;+(state.result===&#x27;correct&#x27;?&#x27;pass&#x27;:&#x27;&#x27;)+&#x27;&quot; role=&quot;status&quot;&gt;&#x27;+(state.result===&#x27;correct&#x27;?&#x27;&lt;strong&gt;Correct for this case.&lt;/strong&gt;&lt;p&gt;Backward computes and accumulates derivatives. The optimizer owns the update. This single choice is not yet evidence of transfer.&lt;/p&gt;&lt;button data-view=&quot;lab&quot;&gt;Inspect the trace&lt;/button&gt;&#x27;:state.result===&#x27;unknown&#x27;?&#x27;&lt;strong&gt;Let’s inspect it together.&lt;/strong&gt;&lt;p&gt;Watch the parameter and gradient buffers separately. Then try a fresh example.&lt;/p&gt;&lt;button data-view=&quot;lab&quot;&gt;Open the experiment&lt;/button&gt;&#x27;:&#x27;&lt;strong&gt;A useful distinction to investigate.&lt;/strong&gt;&lt;p&gt;The weights stay unchanged. I would first check whether “backward” or “update” caused the confusion.&lt;/p&gt;&lt;button data-action=&quot;detour&quot;&gt;Preview a targeted explanation&lt;/button&gt;&#x27;)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;

function lesson(){
 return &#x27;&lt;div class=&quot;cc-eyebrow&quot;&gt;Chapter 04 · Episode 2 · 15 min suggested&lt;/div&gt;&lt;h2&gt;Backward finds the change.&lt;br&gt;The optimizer makes it.&lt;/h2&gt;&lt;p class=&quot;cc-sub&quot;&gt;Follow a tiny model all the way from prediction to an updated weight.&lt;/p&gt;&lt;div class=&quot;cc-objective&quot;&gt;By the end, you can tell which buffers change in each phase of training—and explain why.&lt;/div&gt;&#x27;+(state.remediation?&#x27;&lt;div class=&quot;cc-result&quot;&gt;&lt;strong&gt;Personal detour · generated in the proposed product&lt;/strong&gt;&lt;p&gt;Think of parameters as the current configuration and gradients as a separate buffer of sensitivities. Filling that buffer does not write the configuration.&lt;/p&gt;&lt;p&gt;Two backward calls can accumulate into the gradient buffer before a single optimizer update.&lt;/p&gt;&lt;button class=&quot;cc-quiet&quot; data-action=&quot;undo&quot;&gt;Remove this sample detour&lt;/button&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;div class=&quot;cc-panel&quot;&gt;&lt;div class=&quot;cc-flex cc-between&quot;&gt;&lt;h3&gt;One input. Two parameters.&lt;/h3&gt;&lt;button class=&quot;cc-quiet&quot; data-action=&quot;ask-graph&quot;&gt;Ask about this&lt;/button&gt;&lt;/div&gt;&#x27;+graph()+&#x27;&lt;div class=&quot;cc-flex&quot;&gt;&lt;button class=&quot;cc-primary&quot; data-action=&quot;step&quot;&gt;&#x27;+(state.phase===0?&#x27;Run backward&#x27;:state.phase===1?&#x27;Apply update&#x27;:&#x27;Start again&#x27;)+&#x27;&lt;/button&gt;&lt;button data-view=&quot;lab&quot;&gt;Open experiment&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+check()+&#x27;&lt;details&gt;&lt;summary&gt;Connect this to the TAH worker&lt;/summary&gt;&lt;p&gt;A pipeline split can calculate parameter gradients and the gradient to send upstream. The optimizer update is a separate event. A recorded backward alone does not establish credited network contribution.&lt;/p&gt;&lt;/details&gt;&#x27;;
